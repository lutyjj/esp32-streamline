name: CI

on:
  push:
    branches: [mainline]
    tags: ['v*']
  pull_request:
    branches: [mainline]
  workflow_dispatch:

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (ruff, clang-format, mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Run make lint
        run: make lint

  test:
    name: Test (bridge unittests + firmware builds)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # No cache: make test runs pio inside Docker as root, so any cached
      # .platformio-home files would be root-owned and unreadable by the
      # post-job cache step. PlatformIO's toolchain download is fast enough
      # (~30s) that re-fetching per run is simpler than fixing ownership.
      - name: Run make test
        run: make test
