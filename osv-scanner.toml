# Accepted advisories for `make repository-dependency-audit`.
#
# Every entry needs the advisory id, a reason the finding is not actionable
# here, and an expiry so the acceptance is re-argued instead of forgotten:
#
#   [[IgnoredVulns]]
#   id = "GHSA-xxxx-xxxx-xxxx"
#   ignoreUntil = 2026-12-31T00:00:00Z
#   reason = "the vulnerable API is unreachable from StreamLine; re-check on expiry"

