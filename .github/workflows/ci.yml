name: CI

on:
  push:
    branches: [mainline]
  pull_request:
    branches: [mainline]
  workflow_dispatch:

permissions:
  contents: read

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Single source of truth for "what is a component". The `filters` block maps
  # paths to component names; this job turns the ones a change touched into a
  # matrix. Adding a lightweight component is two declarative edits and no new
  # job: a filter entry here, plus a `<name>-check` target in the Makefile.
  # `firmware` is deliberately excluded from the matrix — its toolchain caching
  # makes it fundamentally different, so it keeps a bespoke job below.
  changes:
    name: Detect changed areas
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      components: ${{ steps.matrix.outputs.components }}
      firmware: ${{ steps.filter.outputs.firmware }}
      api_contract: ${{ steps.filter.outputs.api_contract }}
      qemu_smoke: ${{ steps.filter.outputs.qemu_smoke }}
      release_snapshot: ${{ steps.release-snapshot.outputs.exact }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4
        id: filter
        with:
          filters: .github/ci-paths.yml
      - name: Classify a release snapshot
        id: release-snapshot
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EVENT_NAME: ${{ github.event_name }}
          HEAD_REF: ${{ github.head_ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          exact=false
          if [ "$EVENT_NAME" = pull_request ] && [[ "$HEAD_REF" == release/* ]]; then
            expected=$(mktemp)
            api_changed=$(mktemp)
            manifest=$(mktemp)
            trap 'rm -f "$expected" "$api_changed" "$manifest"' EXIT
            pull=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER")
            jq -e --arg base "$BASE_SHA" --arg head "$HEAD_SHA" \
              '.base.sha == $base and .head.sha == $head' <<<"$pull" >/dev/null
            git show "$BASE_SHA:release-manifest.json" > "$manifest"
            jq -e '.schema_version == 1 and (.snapshot_paths | type == "array" and length > 0)' \
              "$manifest" >/dev/null
            jq -r '.snapshot_paths[]' "$manifest" | LC_ALL=C sort -u > "$expected"
            gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/files?per_page=100" \
              --jq '.[] | .filename, (.previous_filename // empty)' \
              | LC_ALL=C sort -u > "$api_changed"
            if diff -u "$expected" "$api_changed"; then
              exact=true
            fi
          fi
          echo "exact=$exact" >> "$GITHUB_OUTPUT"
      - id: matrix
        # Fan out over every matched component except the bespoke firmware job
        # and the internal pseudo-filters.
        run: |
          components=$(echo '${{ steps.filter.outputs.changes }}' \
            | jq -c '[.[] | select(. != "firmware" and . != "shared" and . != "api_contract" and . != "qemu_smoke")]')
          echo "components=$components" >> "$GITHUB_OUTPUT"

  # One job, every lightweight component. The command is uniform because each
  # component owns a `make <name>-check` recipe.
  checks:
    name: ${{ matrix.component }}
    needs: changes
    if: >-
      needs.changes.outputs.components != '[]' &&
      !(github.event_name == 'pull_request' && startsWith(github.head_ref, 'release/') &&
        needs.changes.outputs.release_snapshot == 'true')
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        component: ${{ fromJSON(needs.changes.outputs.components) }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - run: make ${{ matrix.component }}-check

  firmware:
    name: Firmware (clippy · test · release build)
    needs: changes
    if: >-
      (needs.changes.outputs.firmware == 'true' || needs.changes.outputs.qemu_smoke == 'true') &&
      !(github.event_name == 'pull_request' && startsWith(github.head_ref, 'release/') &&
        needs.changes.outputs.release_snapshot == 'true')
    runs-on: ubuntu-latest
    env:
      CONTAINER_USER: 0:0
      CONTAINER_CARGO_HOME: /cargo-cache
      FIRMWARE_CARGO_CACHE_PATH: firmware/streamline/.cargo-home
      FIRMWARE_EMBUILD_CACHE_PATH: firmware/streamline/.embuild
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Restore firmware caches
        id: firmware-cache
        uses: ./.github/actions/firmware-cache
        with:
          operation: restore
          container-user: ${{ env.CONTAINER_USER }}
          cargo-cache-path: ${{ env.FIRMWARE_CARGO_CACHE_PATH }}
          embuild-cache-path: ${{ env.FIRMWARE_EMBUILD_CACHE_PATH }}

      - name: Check
        if: ${{ needs.changes.outputs.firmware == 'true' }}
        run: |
          make firmware-check \
            CONTAINER_EXTRA_FLAGS="-v $PWD/$FIRMWARE_CARGO_CACHE_PATH:$CONTAINER_CARGO_HOME"

      # The QEMU image variant must keep compiling, and the smoke job below
      # needs its images. Built here because this job owns the warm toolchain
      # caches; the qemu-smoke job only needs Docker and the artifacts.
      - name: Build QEMU variant images
        run: |
          make firmware-qemu-artifacts \
            CONTAINER_EXTRA_FLAGS="-v $PWD/$FIRMWARE_CARGO_CACHE_PATH:$CONTAINER_CARGO_HOME"

      - name: Upload QEMU variant images
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: qemu-firmware-images-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            dist/firmware/streamline-qemu-full.bin
            dist/firmware/streamline-qemu-ota.bin
          retention-days: 3
          if-no-files-found: error

      - name: Reclaim firmware caches
        if: always()
        uses: ./.github/actions/firmware-cache
        with:
          operation: reclaim
          cargo-cache-path: ${{ env.FIRMWARE_CARGO_CACHE_PATH }}
          embuild-cache-path: ${{ env.FIRMWARE_EMBUILD_CACHE_PATH }}

      - name: Save firmware caches
        if: ${{ success() }}
        uses: ./.github/actions/firmware-cache
        with:
          operation: save
          cargo-cache-path: ${{ env.FIRMWARE_CARGO_CACHE_PATH }}
          embuild-cache-path: ${{ env.FIRMWARE_EMBUILD_CACHE_PATH }}
          embuild-cache-hit: ${{ steps.firmware-cache.outputs.embuild-cache-hit }}
          cargo-cache-hit: ${{ steps.firmware-cache.outputs.cargo-cache-hit }}

  # Boots the QEMU firmware variant and runs the emulated-device test suite:
  # boot, HTTP API, provisioning persistence, key gating, factory reset, and
  # the OTA slot switch. The firmware job supplies images built from the exact
  # commit selected by the QEMU ownership filter.
  qemu-smoke:
    name: QEMU device smoke
    needs: [changes, firmware]
    if: >-
      needs.changes.outputs.qemu_smoke == 'true' &&
      !(github.event_name == 'pull_request' && startsWith(github.head_ref, 'release/') &&
        needs.changes.outputs.release_snapshot == 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: qemu-firmware-images-${{ github.sha }}-${{ github.run_attempt }}
          path: dist/firmware
      - run: make tools-smoke-qemu

  api-contract:
    name: Device API contract
    needs: changes
    if: >-
      needs.changes.outputs.api_contract == 'true' &&
      !(github.event_name == 'pull_request' && startsWith(github.head_ref, 'release/') &&
        needs.changes.outputs.release_snapshot == 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - run: make api-contract-check

  release-verify:
    name: Release snapshot
    needs: changes
    if: ${{ github.event_name == 'pull_request' && startsWith(github.head_ref, 'release/') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Require the exact release file set
        run: test "${{ needs.changes.outputs.release_snapshot }}" = true
      - name: Set up QEMU for cross-architecture builds
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4
      - run: make release-verify

  # Single stable status the whole workflow rolls up into. Mark THIS as the
  # required check in branch protection: it passes when the relevant jobs pass
  # and treats skipped (unchanged) components as a pass, so path-filtering never
  # leaves a PR stuck waiting on a check that will not report. It needs no edit
  # when a component is added — the matrix job covers all of them.
  ci-complete:
    name: CI complete
    if: ${{ always() }}
    needs: [changes, checks, firmware, qemu-smoke, api-contract, release-verify]
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Verify no required job failed
        run: |
          echo "changes=${{ needs.changes.result }} checks=${{ needs.checks.result }} firmware=${{ needs.firmware.result }} qemu_smoke=${{ needs.qemu-smoke.result }} api_contract=${{ needs.api-contract.result }} release=${{ needs.release-verify.result }}"
          if [ "${{ needs.changes.result }}" != "success" ]; then
            echo "::error::change detection failed"; exit 1
          fi
          for r in "${{ needs.checks.result }}" "${{ needs.firmware.result }}" "${{ needs.qemu-smoke.result }}" "${{ needs.api-contract.result }}" "${{ needs.release-verify.result }}"; do
            case "$r" in
              success|skipped) ;;
              *) echo "::error::a required job did not pass ($r)"; exit 1 ;;
            esac
          done
          echo "All required checks passed."
