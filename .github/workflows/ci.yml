name: CI

on:
  push:
    branches: [mainline]
  pull_request:
    branches: [mainline]
  workflow_dispatch:

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Single source of truth for "what is a component". The `filters` block maps
  # paths to component names; this job turns the ones a change touched into a
  # matrix. Adding a lightweight component is two declarative edits and no new
  # job: a filter entry here, plus a `<name>-check` target in the Makefile.
  # `firmware` is deliberately excluded from the matrix — its toolchain caching
  # makes it fundamentally different, so it keeps a bespoke job below.
  changes:
    name: Detect changed areas
    runs-on: ubuntu-latest
    outputs:
      components: ${{ steps.matrix.outputs.components }}
      firmware: ${{ steps.filter.outputs.firmware }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4
        id: filter
        with:
          # A change to the shared build entrypoints re-runs every component.
          filters: |
            shared: &shared
              - '.github/workflows/ci.yml'
              - 'Makefile'
              - 'mk/**'
            bridge:
              - *shared
              - 'bridge/**'
            console:
              - *shared
              - 'console/**'
            tools:
              - *shared
              - 'tools/**'
            webflasher:
              - *shared
              - 'webflasher/**'
            ha-addon:
              - *shared
              - 'ha-addon/**'
              - 'repository.yaml'
              - 'bridge/pyproject.toml'
              - 'bridge/uv.lock'
              - 'bridge/src/**'
              - 'bridge/tests/**'
            firmware:
              - *shared
              - 'firmware/**'
      - id: matrix
        # Fan out over every matched component except the bespoke firmware one
        # (and the internal `shared` pseudo-filter).
        run: |
          components=$(echo '${{ steps.filter.outputs.changes }}' \
            | jq -c '[.[] | select(. != "firmware" and . != "shared")]')
          echo "components=$components" >> "$GITHUB_OUTPUT"

  # One job, every lightweight component. The command is uniform because each
  # component owns a `make <name>-check` recipe.
  checks:
    name: ${{ matrix.component }}
    needs: changes
    if: >-
      needs.changes.outputs.components != '[]' &&
      !(github.event_name == 'pull_request' && startsWith(github.head_ref, 'release/'))
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        component: ${{ fromJSON(needs.changes.outputs.components) }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - run: make ${{ matrix.component }}-check

  firmware:
    name: Firmware (clippy · test · release build)
    needs: changes
    if: >-
      needs.changes.outputs.firmware == 'true' &&
      !(github.event_name == 'pull_request' && startsWith(github.head_ref, 'release/'))
    runs-on: ubuntu-latest
    env:
      CONTAINER_USER: 0:0
      CONTAINER_CARGO_HOME: /cargo-cache
      FIRMWARE_CARGO_CACHE_PATH: firmware/streamline/.cargo-home
      FIRMWARE_EMBUILD_CACHE_PATH: firmware/streamline/.embuild
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      # esp-idf-sys compiles the whole ESP-IDF into .embuild (~4 GB); it only
      # changes when the toolchain or esp-idf-sys version does, so it gets a
      # stable content-addressed key. Restore and save are split so we only
      # write it back on a clean success — a cancelled or failed build can never
      # poison this key with a half-built ESP-IDF. This restore is what turns a
      # ~6 min cold build into ~1-2 min. Bump the v1 prefix to invalidate keys.
      - name: Restore ESP-IDF build (.embuild)
        id: embuild
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ env.FIRMWARE_EMBUILD_CACHE_PATH }}
          key: fw-embuild-v1-${{ hashFiles('firmware/streamline/Cargo.lock', 'firmware/streamline/rust-toolchain.toml', 'firmware/streamline/Dockerfile', 'firmware/streamline/sdkconfig.defaults') }}

      - name: Restore firmware Cargo home
        id: cargo-home
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ env.FIRMWARE_CARGO_CACHE_PATH }}
          key: fw-cargo-v1-${{ hashFiles('firmware/streamline/Cargo.lock', 'firmware/streamline/rust-toolchain.toml') }}
          restore-keys: |
            fw-cargo-v1-

      - name: Hand firmware caches to toolchain container
        run: |
          mkdir -p "$FIRMWARE_CARGO_CACHE_PATH"
          for path in "$FIRMWARE_EMBUILD_CACHE_PATH" "$FIRMWARE_CARGO_CACHE_PATH"; do
            if [ -e "$path" ]; then
              sudo chown -R "$CONTAINER_USER" "$path"
            fi
          done

      - name: Check
        run: |
          make firmware-check \
            CONTAINER_EXTRA_FLAGS="-v $PWD/$FIRMWARE_CARGO_CACHE_PATH:$CONTAINER_CARGO_HOME"

      - name: Reclaim firmware caches
        if: always()
        run: |
          for path in "$FIRMWARE_EMBUILD_CACHE_PATH" "$FIRMWARE_CARGO_CACHE_PATH"; do
            if [ -e "$path" ]; then
              sudo chown -R "$(id -u):$(id -g)" "$path"
            fi
          done

      - name: Save ESP-IDF build (.embuild)
        if: ${{ success() && steps.embuild.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ env.FIRMWARE_EMBUILD_CACHE_PATH }}
          key: fw-embuild-v1-${{ hashFiles('firmware/streamline/Cargo.lock', 'firmware/streamline/rust-toolchain.toml', 'firmware/streamline/Dockerfile', 'firmware/streamline/sdkconfig.defaults') }}

      - name: Save firmware Cargo home
        if: ${{ success() && steps.cargo-home.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ env.FIRMWARE_CARGO_CACHE_PATH }}
          key: fw-cargo-v1-${{ hashFiles('firmware/streamline/Cargo.lock', 'firmware/streamline/rust-toolchain.toml') }}

  release-verify:
    name: Release snapshot
    if: ${{ github.event_name == 'pull_request' && startsWith(github.head_ref, 'release/') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Set up QEMU for cross-architecture builds
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4
      - run: make release-verify

  # Single stable status the whole workflow rolls up into. Mark THIS as the
  # required check in branch protection: it passes when the relevant jobs pass
  # and treats skipped (unchanged) components as a pass, so path-filtering never
  # leaves a PR stuck waiting on a check that will not report. It needs no edit
  # when a component is added — the matrix job covers all of them.
  ci-complete:
    name: CI complete
    if: ${{ always() }}
    needs: [changes, checks, firmware, release-verify]
    runs-on: ubuntu-latest
    steps:
      - name: Verify no required job failed
        run: |
          echo "changes=${{ needs.changes.result }} checks=${{ needs.checks.result }} firmware=${{ needs.firmware.result }} release=${{ needs.release-verify.result }}"
          if [ "${{ needs.changes.result }}" != "success" ]; then
            echo "::error::change detection failed"; exit 1
          fi
          for r in "${{ needs.checks.result }}" "${{ needs.firmware.result }}" "${{ needs.release-verify.result }}"; do
            case "$r" in
              success|skipped) ;;
              *) echo "::error::a required job did not pass ($r)"; exit 1 ;;
            esac
          done
          echo "All required checks passed."
