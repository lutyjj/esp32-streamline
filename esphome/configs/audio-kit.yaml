substitutions:
  name: esp32-streamline
  friendly_name: ESP32 StreamLine
  bridge_host: 192.168.100.161

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  project:
    name: lutyjj.esp32-streamline
    version: 0.2.0-esphome-spike

external_components:
  # es8388 shadows the built-in component to add fixed-gain / ALC-off line-in.
  - source:
      type: local
      path: ../components
    components: [streamline, es8388]

esp32:
  board: esp32dev
  flash_size: 8MB
  toolchain: esp-idf
  framework:
    type: esp-idf

logger:
  level: INFO

# Native API for Home Assistant. Streaming to the bridge does not need this; it
# is here to expose the codec controls and diagnostics below. Generate your own
# key with `openssl rand -base64 32` and treat it as a secret for real use.
api:
  encryption:
    key: "NabtgRinXUWTvImpPncSmdwZDlNla9m1JkfIoEeMUHI="

wifi:
  ssid: "REPLACE_WITH_WIFI_SSID"
  password: "REPLACE_WITH_WIFI_PASSWORD"
  # Continuous PCM streaming needs the radio always on. ESPHome's default
  # light power-save sleeps between beacons, which some APs answer with an
  # "Auth Expired" deauth -> reconnect loop that shreds the stream.
  power_save_mode: none
  # Reconnect to the known BSSID without a full scan on every drop.
  fast_connect: true
  ap:
    ssid: "ESP32-StreamLine-Fallback"
    password: "REPLACE_WITH_A_LONG_UNIQUE_PASSWORD"
    # Don't bail to the fallback AP on a brief drop; only after a real outage.
    ap_timeout: 1min

captive_portal:

ota:
  - platform: esphome
    password: "REPLACE_WITH_A_LONG_UNIQUE_PASSWORD"

i2c:
  sda: GPIO33
  scl: GPIO32
  frequency: 100kHz
  id: audio_i2c

# Upstream's es8388 forces voice-recording ALC (up to +23.5 dB auto-gain), which
# clips a line-level source. The vendored copy under components/es8388 exposes
# these knobs. These are the boot defaults; the HA controls below tune them live.
audio_dac:
  - platform: es8388
    id: es8388_codec
    auto_gain: false
    mic_gain: 0dB
    adc_attenuation: 12

# The es8388 component also exposes the ADC input line selection.
select:
  - platform: es8388
    es8388_id: es8388_codec
    adc_input_mic:
      name: "StreamLine ADC Input"

# Live HA control of the codec gain path. Values are applied to the ES8388 over
# I2C immediately and restored across reboots.
number:
  - platform: template
    name: "Mic Gain"
    id: mic_gain
    unit_of_measurement: "dB"
    min_value: 0
    max_value: 24
    step: 3
    initial_value: 0
    optimistic: true
    restore_value: true
    set_action:
      - lambda: "id(es8388_codec).set_mic_gain((uint8_t) (x / 3));"
  - platform: template
    name: "ADC Attenuation"
    id: adc_attenuation
    unit_of_measurement: "dB"
    min_value: 0
    max_value: 48
    step: 0.5
    initial_value: 12
    optimistic: true
    restore_value: true
    set_action:
      - lambda: "id(es8388_codec).set_adc_attenuation(x);"

switch:
  - platform: template
    name: "Auto Gain (ALC)"
    id: auto_gain
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    turn_on_action:
      - lambda: "id(es8388_codec).set_auto_gain(true);"
    turn_off_action:
      - lambda: "id(es8388_codec).set_auto_gain(false);"

sensor:
  - platform: wifi_signal
    name: "WiFi Signal"
    update_interval: 5s

i2s_audio:
  id: audio_i2s
  i2s_lrclk_pin: GPIO25
  i2s_bclk_pin: GPIO27
  i2s_mclk_pin: GPIO0

microphone:
  - platform: i2s_audio
    id: line_in
    i2s_audio_id: audio_i2s
    i2s_din_pin: GPIO35
    adc_type: external
    pdm: false
    sample_rate: 48000
    bits_per_sample: 16bit
    channel: stereo
    use_apll: true

streamline:
  microphone_id: line_in
  target_host: ${bridge_host}
  target_port: 39000
  # ESPHome documents stereo microphone data as right then left. StreamLine's
  # protocol is left then right, so retain this default until hardware A/B test.
  swap_stereo: true
