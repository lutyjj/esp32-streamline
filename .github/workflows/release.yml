name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Verify and publish release
    runs-on: ubuntu-latest
    env:
      CONTAINER_USER: 0:0
      CONTAINER_CARGO_HOME: /cargo-cache
      FIRMWARE_CARGO_CACHE_PATH: firmware/streamline/.cargo-home
      FIRMWARE_EMBUILD_CACHE_PATH: firmware/streamline/.embuild
    steps:
      - uses: actions/checkout@v7

      - name: Derive and validate release version
        id: version
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          make version-check VERSION="$version"
          printf 'value=%s\n' "$version" >> "$GITHUB_OUTPUT"

      # Restore-only: CI owns these caches (see ci.yml); reusing them turns the
      # cold ESP-IDF + cargo build into an incremental one.
      - name: Restore ESP-IDF build (.embuild)
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.FIRMWARE_EMBUILD_CACHE_PATH }}
          key: fw-embuild-v1-${{ hashFiles('firmware/streamline/Cargo.lock', 'firmware/streamline/rust-toolchain.toml', 'firmware/streamline/Dockerfile', 'firmware/streamline/sdkconfig.defaults') }}

      - name: Restore firmware Cargo home
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.FIRMWARE_CARGO_CACHE_PATH }}
          key: fw-cargo-v1-${{ hashFiles('firmware/streamline/Cargo.lock', 'firmware/streamline/rust-toolchain.toml') }}
          restore-keys: |
            fw-cargo-v1-

      - name: Hand firmware caches to toolchain container
        run: |
          mkdir -p "$FIRMWARE_CARGO_CACHE_PATH"
          for path in "$FIRMWARE_EMBUILD_CACHE_PATH" "$FIRMWARE_CARGO_CACHE_PATH"; do
            if [ -e "$path" ]; then
              sudo chown -R "$CONTAINER_USER" "$path"
            fi
          done

      - name: Build release deliverables
        run: |
          make release \
            VERSION=${{ steps.version.outputs.value }} \
            BRIDGE_IMAGE=ghcr.io/${{ github.repository_owner }}/esp32-streamline-bridge \
            CONTAINER_EXTRA_FLAGS="-v $PWD/$FIRMWARE_CARGO_CACHE_PATH:$CONTAINER_CARGO_HOME"

      - name: Reclaim firmware caches
        if: always()
        run: |
          for path in "$FIRMWARE_EMBUILD_CACHE_PATH" "$FIRMWARE_CARGO_CACHE_PATH"; do
            if [ -e "$path" ]; then
              sudo chown -R "$(id -u):$(id -g)" "$path"
            fi
          done

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Publish container images
        env:
          BRIDGE_IMAGE: ghcr.io/${{ github.repository_owner }}/esp32-streamline-bridge
          ADDON_IMAGE_BASE: ghcr.io/${{ github.repository_owner }}/esp32-streamline-bridge-addon
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          docker tag "$BRIDGE_IMAGE:$VERSION" "$BRIDGE_IMAGE:latest"
          docker push "$BRIDGE_IMAGE:$VERSION"
          docker push "$BRIDGE_IMAGE:latest"
          for spec in "amd64 linux/amd64" "aarch64 linux/arm64"; do
            set -- $spec
            arch="$1"
            platform="$2"
            image="${ADDON_IMAGE_BASE%/*}/${arch}-${ADDON_IMAGE_BASE##*/}"
            docker buildx build \
              --platform "$platform" \
              -f ha-addon/Dockerfile \
              --build-arg BUILD_VERSION="$VERSION" \
              --build-arg BUILD_ARCH="$arch" \
              -t "$image:$VERSION" \
              -t "$image:latest" \
              --push \
              .
          done

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          # A semver pre-release (e.g. 0.4.0-rc.1) must not become GitHub's
          # "latest": the firmware OTA path and the WebFlasher both track the
          # latest stable release.
          prerelease=
          case "$VERSION" in *-*) prerelease=--prerelease ;; esac
          gh release create "$GITHUB_REF_NAME" dist/firmware/* --generate-notes $prerelease

  # Refresh the GitHub Pages WebFlasher so it serves the firmware just released.
  # Chained explicitly because releases created with GITHUB_TOKEN don't emit a
  # `release` event capable of triggering the pages workflow on their own.
  deploy-flasher:
    name: Refresh WebFlasher
    needs: publish
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml
