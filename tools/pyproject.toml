[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "streamline-tools"
# Internal developer tooling: never released, not covered by version-check.
version = "0.1.0"
description = "ESP32 StreamLine developer tools"
requires-python = ">=3.12"
license = { text = "AGPL-3.0-or-later" }
dependencies = [
  "numpy>=2.2.6,<3",
  "pytest>=8.4,<9",
  "pytest-embedded>=2.8,<3",
  "pytest-embedded-qemu>=2.8,<3",
]

[project.scripts]
streamline-analyze = "streamline_tools.analysis.report:main"
streamline-capture = "streamline_tools.serial_capture:main"
streamline-smoke = "streamline_tools.smoke:main"

[dependency-groups]
dev = [
  "mypy",
  "pyyaml>=6.0.3,<7",
  "ruff",
  "types-pyyaml",
  "wcmatch>=10.1,<11",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
files = ["src/streamline_tools", "tests", "smoke"]
mypy_path = ["src", "tests"]

# pytest-embedded ships no py.typed marker; its DUT objects stay dynamically
# typed at the fixture boundary while our own check logic remains strictly typed.
[[tool.mypy.overrides]]
module = ["pytest_embedded.*", "pytest_embedded_qemu.*"]
ignore_missing_imports = true
