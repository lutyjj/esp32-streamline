name: audit

# New advisories appear over time, not only in pull requests: scan every
# committed lockfile on a weekly cadence so a finding surfaces without
# waiting for the next change. Pull requests run the same target through
# the repository check.
on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - run: make repository-dependency-audit
