[target.'cfg(target_os = "espidf")']
linker = "ldproxy"
runner = "espflash flash --monitor"
rustflags = ["--cfg", "espidf_time64"]

[unstable]
build-std = ["std", "panic_abort"]
# No std default features: "backtrace" alone links gimli, addr2line, object,
# miniz_oxide, and rustc-demangle (~82 KB of flash) to symbolize Rust panics
# on-device. Panic messages still print, and the ESP-IDF panic handler still
# dumps the raw backtrace addresses, which the .elf shipped beside every
# release image resolves off-device.
build-std-features = []

[env]
MCU = "esp32"
ESP_IDF_VERSION = "v5.5.3"
ESP_IDF_TOOLS_INSTALL_DIR = "workspace"
