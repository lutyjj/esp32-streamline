name: Image evidence
description: >-
  Resolve a pushed image's manifest digest and bind build-provenance and, unless
  disabled, SPDX SBOM attestations to that digest.
inputs:
  image:
    description: Full image reference with tag (name:tag), already pushed
    required: true
  sbom:
    description: Whether to generate and attest an SBOM ("false" for a multi-platform index)
    required: false
    default: "true"
outputs:
  digest:
    description: The image manifest digest (sha256:...)
    value: ${{ steps.digest.outputs.value }}
runs:
  using: composite
  steps:
    - name: Resolve manifest digest
      id: digest
      shell: bash
      run: |
        digest="$(docker buildx imagetools inspect '${{ inputs.image }}' --format '{{.Manifest.Digest}}')"
        echo "$digest" | grep -Eq '^sha256:[0-9a-f]{64}$'
        printf 'value=%s\n' "$digest" >> "$GITHUB_OUTPUT"
        printf 'name=%s\n' "$(name='${{ inputs.image }}'; echo "${name%:*}")" >> "$GITHUB_OUTPUT"

    - name: Generate image SBOM
      if: inputs.sbom == 'true'
      uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
      with:
        image: ${{ inputs.image }}
        format: spdx-json
        output-file: ${{ runner.temp }}/image-evidence.spdx.json
        upload-artifact: false

    - name: Attest image SBOM
      if: inputs.sbom == 'true'
      uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
      with:
        subject-name: ${{ steps.digest.outputs.name }}
        subject-digest: ${{ steps.digest.outputs.value }}
        sbom-path: ${{ runner.temp }}/image-evidence.spdx.json

    - name: Attest image provenance
      uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
      with:
        subject-name: ${{ steps.digest.outputs.name }}
        subject-digest: ${{ steps.digest.outputs.value }}
