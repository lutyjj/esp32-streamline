[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["device/esp32/stream/.pio", ".platformio-home"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
files = ["bridge/http-wav"]
exclude = ["^bridge/http-wav/tests/"]
