[package]
name = "streamline-firmware"
version = "0.3.1"
edition = "2021"
rust-version = "1.82"
license = "AGPL-3.0-or-later"

[[bin]]
name = "streamline-firmware"
harness = false

[lib]
name = "streamline_firmware"

[profile.release]
opt-level = "s"

[profile.dev]
debug = true
opt-level = "z"

[dependencies]
# Used by the host-testable verifying-download pipeline in `update`, so it must
# build for every target, not only the device.
sha2 = { version = "0.10", default-features = false }

[target.'cfg(target_os = "espidf")'.dependencies]
anyhow = "1"
embedded-svc = "0.29"
esp-idf-svc = { version = "0.52.1", features = ["critical-section"] }
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
embuild = { version = "0.33", features = ["espidf"] }
