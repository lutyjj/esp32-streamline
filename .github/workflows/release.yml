name: Release

# Publishes the draft release the Release Please workflow created at the tag.
# Order is what makes an interrupted run safe to redispatch at the same tag:
# verify the tagged tree, push and attest write-once versioned images, attach
# byte-reproducible firmware to the draft, publish the release as the commit
# point, and only then move the mutable `latest` aliases and the WebFlasher.
# Reruns converge — identical bytes re-upload cleanly, existing
# versioned images are kept, and a published release is left untouched.
on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag (vX.Y.Z)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  # Provenance anchor for every privileged job. The dispatch input is
  # untrusted, so it must name an exact vX.Y.Z release whose recorded commit
  # already lives on the protected mainline. The release record stores the exact
  # commit, so read it from there and require a full SHA.
  verify:
    name: Verify the release commit
    runs-on: ubuntu-latest
    permissions:
      contents: write # GitHub lists draft releases only to tokens with push access.
    env:
      TAG: ${{ inputs.tag }}
      GH_TOKEN: ${{ github.token }}
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
      version: ${{ steps.version.outputs.value }}
      latest: ${{ steps.release-state.outputs.latest }}
      addon-image: ${{ steps.addon.outputs.image }}
      addon-prefix: ${{ steps.addon.outputs.prefix }}
      addon-name: ${{ steps.addon.outputs.name }}
      addon-architectures: ${{ steps.addon.outputs.architectures }}
      addon-matrix: ${{ steps.addon-matrix.outputs.matrix }}
    steps:
      # Mainline history comes first so the ancestry test has the graph.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: mainline
          fetch-depth: 0
          persist-credentials: false

      - name: Verify the release commit is a promoted mainline commit
        id: commit
        env:
          GH_REPO: ${{ github.repository }}
        run: |
          echo "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$' \
            || { echo "release tag must be an exact vX.Y.Z: $TAG" >&2; exit 1; }
          sha="$(gh release view "$TAG" --json targetCommitish --jq .targetCommitish)"
          echo "$sha" | grep -Eq '^[0-9a-f]{40}$' \
            || { echo "release target is not a full commit SHA: $sha" >&2; exit 1; }
          git merge-base --is-ancestor "$sha" origin/mainline \
            || { echo "release commit $sha is not on the protected mainline" >&2; exit 1; }
          printf 'sha=%s\n' "$sha" >> "$GITHUB_OUTPUT"

      - name: Check out the verified release commit
        env:
          SHA: ${{ steps.commit.outputs.sha }}
        run: git switch --detach "$SHA"

      - name: Verify the tagged tree carries the tag's version
        id: version
        run: |
          version="${TAG#v}"
          make version-check VERSION="$version"
          printf 'value=%s\n' "$version" >> "$GITHUB_OUTPUT"

      # A release older than the published latest must not steal the `latest`
      # marker, the image aliases, or the WebFlasher.
      - name: Decide whether this tag becomes latest
        id: release-state
        run: |
          gh release view "$TAG" --json isDraft >/dev/null
          current="$(gh release list --exclude-drafts --exclude-pre-releases --limit 1 --json tagName --jq '.[0].tagName // ""')"
          latest=false
          if [ "$(printf '%s\n%s\n' "$current" "$TAG" | sort -V | tail -1)" = "$TAG" ]; then latest=true; fi
          printf 'latest=%s\n' "$latest" >> "$GITHUB_OUTPUT"

      # config.yaml owns the image Home Assistant pulls and its architectures.
      - name: Read the add-on image
        id: addon
        run: |
          image="$(yq '.image' ha-addon/config.yaml)"
          printf 'image=%s\nprefix=%s\nname=%s\n' "$image" "${image%/*}" "${image##*/}" >> "$GITHUB_OUTPUT"
          printf 'architectures=%s\n' "$(yq -o=json -I=0 '.arch' ha-addon/config.yaml)" >> "$GITHUB_OUTPUT"

      - name: Prepare the add-on build matrix
        id: addon-matrix
        uses: home-assistant/builder/actions/prepare-multi-arch-matrix@7412f0023ea9b6e58e8bb5059f1660f51376f49a # 2026.09.0
        with:
          architectures: ${{ steps.addon.outputs.architectures }}
          image-name: ${{ steps.addon.outputs.name }}
          registry-prefix: ${{ steps.addon.outputs.prefix }}

  # Home Assistant's builder actions build, sign and push each architecture,
  # then the multi-arch image. Versioned tags are write-once.
  addon-image:
    name: Build add-on ${{ matrix.arch }} image
    needs: verify
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.verify.outputs.addon-matrix) }}
    # No docker-mirror: build-image's BuildKit builder reads no dockerd mirror, so
    # both it and `make ha-addon-context` keep the runner's Docker Hub login.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: mainline
          fetch-depth: 0
          persist-credentials: false

      - name: Check out the verified release commit
        env:
          SHA: ${{ needs.verify.outputs.sha }}
        run: git switch --detach "$SHA"

      - name: Assemble the build context
        run: make ha-addon-context

      - name: Build and push the image
        uses: home-assistant/builder/actions/build-image@7412f0023ea9b6e58e8bb5059f1660f51376f49a # 2026.09.0
        with:
          arch: ${{ matrix.arch }}
          build-args: BUILD_REVISION=${{ needs.verify.outputs.sha }}
          cache-gha: "false"
          container-registry-password: ${{ secrets.GITHUB_TOKEN }}
          context: ha-addon/.build-context
          image: ${{ matrix.image }}
          image-tags: ${{ needs.verify.outputs.version }}
          push: "true"
          skip-existing: ${{ needs.verify.outputs.version }}
          version: ${{ needs.verify.outputs.version }}

      - name: Image evidence
        uses: ./.github/actions/image-evidence
        with:
          image: ${{ matrix.image }}:${{ needs.verify.outputs.version }}

  addon-manifest:
    name: Publish the add-on multi-arch image
    needs: [verify, addon-image]
    runs-on: ubuntu-latest
    permissions:
      packages: write
      id-token: write
    steps:
      - name: Publish the multi-arch manifest
        uses: home-assistant/builder/actions/publish-multi-arch-manifest@7412f0023ea9b6e58e8bb5059f1660f51376f49a # 2026.09.0
        with:
          architectures: ${{ needs.verify.outputs.addon-architectures }}
          container-registry-password: ${{ secrets.GITHUB_TOKEN }}
          image-name: ${{ needs.verify.outputs.addon-name }}
          image-tags: ${{ needs.verify.outputs.version }}
          registry-prefix: ${{ needs.verify.outputs.addon-prefix }}
          skip-existing: ${{ needs.verify.outputs.version }}

  publish:
    name: Verify and publish release
    needs: [verify, addon-manifest]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    env:
      TAG: ${{ inputs.tag }}
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.verify.outputs.version }}
      CONTAINER_USER: 0:0
      CONTAINER_CARGO_HOME: /cargo-cache
      FIRMWARE_CARGO_CACHE_PATH: firmware/streamline/.cargo-home
      FIRMWARE_EMBUILD_CACHE_PATH: firmware/streamline/.embuild
      BRIDGE_IMAGE: ghcr.io/${{ github.repository_owner }}/esp32-streamline-bridge
      ADDON_IMAGE: ${{ needs.verify.outputs.addon-image }}
      ADDON_MATRIX: ${{ needs.verify.outputs.addon-matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: mainline
          fetch-depth: 0
          persist-credentials: false

      # Runner setup must happen before switching to the release tree so a
      # recovery run can use current infrastructure with the original sources.
      - uses: ./.github/actions/docker-mirror

      - name: Check out the verified release commit
        env:
          SHA: ${{ needs.verify.outputs.sha }}
        run: git switch --detach "$SHA"

      # CI owns cache writes. Publishing restores the same cache lifecycle and
      # leaves its contents reusable by the next firmware verification.
      - name: Restore firmware caches
        uses: ./.github/actions/firmware-cache
        with:
          operation: restore
          container-user: ${{ env.CONTAINER_USER }}
          cargo-cache-path: ${{ env.FIRMWARE_CARGO_CACHE_PATH }}
          embuild-cache-path: ${{ env.FIRMWARE_EMBUILD_CACHE_PATH }}

      - name: Build firmware and prove reproducibility
        run: |
          make firmware-build \
            CONTAINER_EXTRA_FLAGS="-v $PWD/$FIRMWARE_CARGO_CACHE_PATH:$CONTAINER_CARGO_HOME"
          make firmware-repro-check VERSION="$VERSION" \
            CONTAINER_EXTRA_FLAGS="-v $PWD/$FIRMWARE_CARGO_CACHE_PATH:$CONTAINER_CARGO_HOME"

      # The maintainer's RSA-3072 key signs the release images so the firmware
      # accepts them over the air (issue #337); the device rejects any image the
      # key did not sign. The private key exists only in the FIRMWARE_SIGNING_KEY
      # secret — written to a gitignored file for the containerized signer and
      # shredded right after, so it never lands in target/, dist/, or a layer.
      - name: Materialize the firmware signing key
        env:
          FIRMWARE_SIGNING_KEY: ${{ secrets.FIRMWARE_SIGNING_KEY }}
        run: |
          umask 077
          test -n "$FIRMWARE_SIGNING_KEY" || { echo "FIRMWARE_SIGNING_KEY secret is not set" >&2; exit 1; }
          printf '%s\n' "$FIRMWARE_SIGNING_KEY" > firmware/streamline/.release_signing_key.pem

      - name: Package signed firmware
        run: |
          make firmware-package VERSION="$VERSION" \
            SIGNING_KEY=.release_signing_key.pem \
            CONTAINER_EXTRA_FLAGS="-v $PWD/$FIRMWARE_CARGO_CACHE_PATH:$CONTAINER_CARGO_HOME"

      - name: Shred the firmware signing key
        if: always()
        run: shred -u firmware/streamline/.release_signing_key.pem 2>/dev/null || rm -f firmware/streamline/.release_signing_key.pem

      - name: Reclaim firmware caches
        if: always()
        uses: ./.github/actions/firmware-cache
        with:
          operation: reclaim
          cargo-cache-path: ${{ env.FIRMWARE_CARGO_CACHE_PATH }}
          embuild-cache-path: ${{ env.FIRMWARE_EMBUILD_CACHE_PATH }}

      # One SPDX SBOM from the locked cargo graph, published beside the
      # binaries and bound to each of them by an SBOM attestation.
      - name: Generate firmware SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          file: firmware/streamline/Cargo.lock
          format: spdx-json
          output-file: dist/firmware/streamline-${{ env.VERSION }}.spdx.json
          upload-artifact: false

      - name: Attest firmware provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/firmware/*

      - name: Attest firmware SBOM
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-path: |
            dist/firmware/streamline-*.bin
            dist/firmware/streamline-*.elf
          sbom-path: dist/firmware/streamline-${{ env.VERSION }}.spdx.json

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Versioned tags are write-once: a rerun keeps an already-published
      # image rather than replacing it under consumers.
      - name: Push the versioned bridge image
        run: |
          make bridge-image VERSION="$VERSION" BRIDGE_IMAGE="$BRIDGE_IMAGE"
          if docker manifest inspect "$BRIDGE_IMAGE:$VERSION" >/dev/null 2>&1; then
            echo "$BRIDGE_IMAGE:$VERSION already published; keeping it"
          else
            docker push "$BRIDGE_IMAGE:$VERSION"
          fi

      - name: Bridge image evidence
        id: bridge-evidence
        uses: ./.github/actions/image-evidence
        with:
          image: ${{ env.BRIDGE_IMAGE }}:${{ env.VERSION }}

      # Each architecture's image carries its own SBOM; an SBOM of the index would
      # describe only the runner's platform.
      - name: Add-on image evidence
        id: addon-evidence
        uses: ./.github/actions/image-evidence
        with:
          image: ${{ env.ADDON_IMAGE }}:${{ env.VERSION }}
          sbom: "false"

      # Fail closed: nothing publishes unless every asset and image verifies
      # against its recorded attestations.
      - name: Verify attestations before publishing
        run: |
          for f in dist/firmware/*; do
            gh attestation verify "$f" --repo "$GITHUB_REPOSITORY"
          done
          subjects="$BRIDGE_IMAGE@${{ steps.bridge-evidence.outputs.digest }} $ADDON_IMAGE@${{ steps.addon-evidence.outputs.digest }}"
          for image in $(jq -r '.include[].image' <<< "$ADDON_MATRIX"); do
            subjects="$subjects $image:$VERSION"
          done
          for subject in $subjects; do
            gh attestation verify "oci://$subject" --repo "$GITHUB_REPOSITORY"
          done

      # The commit point. Assets attach while the release is a draft;
      # publishing locks them (immutable releases). A rerun that finds the
      # release already published leaves it untouched.
      - name: Attach assets and publish the release
        env:
          LATEST: ${{ needs.verify.outputs.latest }}
        run: |
          if [ "$(gh release view "$TAG" --json isDraft --jq .isDraft)" = "true" ]; then
            gh release upload "$TAG" dist/firmware/* --clobber
            gh release edit "$TAG" --draft=false --latest="$LATEST"
          else
            echo "release $TAG is already published"
          fi

      - name: Move latest image aliases
        if: ${{ needs.verify.outputs.latest == 'true' }}
        run: |
          images="$BRIDGE_IMAGE $ADDON_IMAGE $(jq -r '.include[].image' <<< "$ADDON_MATRIX")"
          for image in $images; do
            docker buildx imagetools create --tag "$image:latest" "$image:$VERSION"
          done

  # Refresh the GitHub Pages WebFlasher so it serves the firmware just
  # released. Chained explicitly because releases handled with GITHUB_TOKEN
  # don't emit a `release` event capable of triggering the pages workflow.
  deploy-flasher:
    name: Refresh WebFlasher
    needs: [verify, publish]
    if: ${{ needs.verify.outputs.latest == 'true' }}
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml
