services:
  streamline-http:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VERSION: ${STREAMLINE_VERSION:-dev}
    image: ${STREAMLINE_IMAGE:-esp32-streamline-bridge}:${STREAMLINE_IMAGE_TAG:-local}
    restart: unless-stopped
    environment:
      STREAMLINE_SOURCE_ALLOW: ${STREAMLINE_SOURCE_ALLOW:-}
      STREAMLINE_RECORDINGS_DIR: ${STREAMLINE_RECORDINGS_DIR:-}
      STREAMLINE_API_TOKEN: ${STREAMLINE_API_TOKEN:-}
    command:
      - --transport-state-file
      - /data/transport.json
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp
    volumes:
      - recordings:/recordings
      - transport-data:/data
    ports:
      - "39000:39000/tcp"
      - "8088:8088/tcp"

volumes:
  recordings:
  transport-data:
