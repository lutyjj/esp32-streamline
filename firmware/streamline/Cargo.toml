[package]
name = "streamline-firmware"
version = "0.21.0" # x-release-please-version
edition = "2021"
rust-version = "1.95"
license = "GPL-3.0-or-later"

[[bin]]
name = "streamline-firmware"
test = false

[lib]
name = "streamline_firmware"

[profile.release]
# The image must fit its OTA slot (partitions.csv). Fat LTO over one codegen
# unit optimizes std, the dependencies and the firmware as one program.
opt-level = "z"
lto = "fat"
codegen-units = 1

[profile.dev]
debug = true
opt-level = "z"

[dependencies]
# Host-testable core logic, so these must build for every target, not only the
# device: `sha2` backs the verifying-download pipeline in `update`; serde backs
# the board descriptor model in `board`, parsed and validated on the host;
# `backon` spaces the PCM sender's retries in `stream`.
backon = { version = "1.6", default-features = false }
sha2 = { version = "0.11", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_urlencoded = "0.7"
# The device logs at info and above, so release builds compile out the rest.
log = { version = "0.4", features = ["release_max_level_info"] }
anyhow = "1"
# utoipa 6 omits empty response descriptions, which the OpenAPI 3.1 document it
# emits requires. Stay on 5.x until every response declares a description.
utoipa = { version = "5.5.0", optional = true }
# ICU4X ships NFC data apart from the compatibility forms, which keeps the DNS-SD
# name normalizer in identity.rs about 67 KB smaller than unicode-normalization.
icu_normalizer = { version = "2", default-features = false, features = ["compiled_data"] }

[features]
api-spec = ["dep:utoipa"]
# Host-only generator for docs/pcm-frame-vectors.json. Gates the conformance
# corpus so it never compiles into the device image.
pcm-frame-vectors = []
# QEMU image variant: network over the emulated OpenCores Ethernet MAC
# instead of Wi-Fi, audio bring-up skipped. Built by `make -C firmware
# qemu-artifacts`; never part of a hardware release image.
qemu = []
qemu-fail-management = ["qemu"]
test-source = []

[dev-dependencies]
# Host-only: proves the generated id pattern the console imports matches the
# device's own id validation. Never compiled into the device image.
regex = "1"

[target.'cfg(target_os = "espidf")'.dependencies]
embedded-svc = "0.29"
esp-idf-svc = { version = "0.53.0", features = ["critical-section"] }

[build-dependencies]
embuild = { version = "0.33.7", features = ["espidf"] }
# Gzips the embedded console and OpenAPI artifact at build time; the image
# stores and serves them compressed (docs/design.md "HTTP API Shape").
flate2 = "1"

[[package.metadata.esp-idf-sys.extra_components]]
remote_component = { name = "espressif/mdns", version = "1.15.0" }

# ESP-IDF 6 ships Ethernet PHY drivers as components; esp-idf-svc's OpenETH
# driver for the QEMU image needs DP83848. Hardware images do not link it.
[[package.metadata.esp-idf-sys.extra_components]]
remote_component = { name = "espressif/dp83848", version = "1.1.0" }

[[package.metadata.esp-idf-sys.extra_components]]
bindings_header = "bindings.h"

[[bin]]
name = "streamline-openapi"
path = "src/bin/openapi.rs"
required-features = ["api-spec"]

[[bin]]
name = "streamline-pcm-frame-vectors"
path = "src/bin/pcm_frame_vectors.rs"
required-features = ["pcm-frame-vectors"]
