name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Verify and publish release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Derive and validate release version
        id: version
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          make version-check VERSION="$version"
          printf 'value=%s\n' "$version" >> "$GITHUB_OUTPUT"

      # Restore-only: CI owns these caches (see ci.yml); reusing them turns the
      # cold ESP-IDF + cargo build into an incremental one.
      - name: Restore ESP-IDF build (.embuild)
        uses: actions/cache/restore@v4
        with:
          path: firmware/streamline/.embuild
          key: fw-embuild-v1-${{ hashFiles('firmware/streamline/Cargo.lock', 'firmware/streamline/rust-toolchain.toml', 'firmware/streamline/Dockerfile', 'firmware/streamline/sdkconfig.defaults') }}

      - name: Restore cargo target
        uses: actions/cache/restore@v4
        with:
          path: firmware/streamline/target
          key: fw-target-v1-${{ hashFiles('firmware/streamline/Cargo.lock') }}-${{ github.run_id }}
          restore-keys: |
            fw-target-v1-${{ hashFiles('firmware/streamline/Cargo.lock') }}-

      - name: Build release deliverables
        run: make release VERSION=${{ steps.version.outputs.value }} BRIDGE_IMAGE=ghcr.io/${{ github.repository_owner }}/esp32-streamline-bridge

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish bridge image
        env:
          BRIDGE_IMAGE: ghcr.io/${{ github.repository_owner }}/esp32-streamline-bridge
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          docker tag "$BRIDGE_IMAGE:$VERSION" "$BRIDGE_IMAGE:latest"
          docker push "$BRIDGE_IMAGE:$VERSION"
          docker push "$BRIDGE_IMAGE:latest"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          # A semver pre-release (e.g. 0.4.0-rc.1) must not become GitHub's
          # "latest": the firmware OTA path and the WebFlasher both track the
          # latest stable release.
          prerelease=
          case "$VERSION" in *-*) prerelease=--prerelease ;; esac
          gh release create "$GITHUB_REF_NAME" dist/firmware/* --generate-notes $prerelease

  # Refresh the GitHub Pages WebFlasher so it serves the firmware just released.
  # Chained explicitly because releases created with GITHUB_TOKEN don't emit a
  # `release` event capable of triggering the pages workflow on their own.
  deploy-flasher:
    name: Refresh WebFlasher
    needs: publish
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml
