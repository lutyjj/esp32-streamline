name: CI

on:
  push:
    branches: [mainline]
  pull_request:
    branches: [mainline]
  workflow_dispatch:

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (ruff, clang-format, mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Run make lint
        run: make lint

  test:
    name: Test (bridge unittests + firmware builds)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Run make test
        run: make test
