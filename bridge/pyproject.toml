[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[project]
name = "streamline-bridge"
version = "0.11.2" # x-release-please-version
description = "ESP32 StreamLine TCP PCM to HTTP WAV bridge"
requires-python = ">=3.13"
license = { text = "AGPL-3.0-or-later" }
dependencies = [
  "fastapi>=0.141.1,<1",
  # The ingress guard drives h11 connection state directly; uvicorn already
  # resolves it, so this pin only names the contract we depend on.
  "h11>=0.16,<1",
  "uvicorn>=0.52.1,<1",
]

[project.scripts]
streamline-bridge = "streamline_bridge.server:main"
streamline-ha-addon = "streamline_bridge.ha_addon:main"

[dependency-groups]
dev = [
  "httpx2>=2.10.0,<3",
  "mypy",
  "ruff",
]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "T20", "T10", "G", "LOG", "RUF", "C4", "PIE", "RET", "ISC", "TC"]

[tool.mypy]
python_version = "3.13"
strict = true
warn_unreachable = true
files = ["src/streamline_bridge", "tests"]
mypy_path = ["src"]
