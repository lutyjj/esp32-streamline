# Dependency updates, grouped by the proof each needs. One weekly pull request
# carries every host-side ecosystem, which CI proves on its own. The firmware
# group runs monthly because its proof includes the QEMU smoke and, for
# network, TLS, or audio changes, a device. GitHub Actions stay separate
# because they change the CI that judges the other groups. Version updates for
# uv and Cargo also refresh transitive dependencies, so routine updates carry
# most advisory fixes; security updates still open as soon as an advisory
# lands. Pins stay immutable: actions by commit SHA and images by digest, each
# with a readable version.
version: 2

multi-ecosystem-groups:
  host:
    schedule:
      interval: weekly
    commit-message:
      prefix: build
      include: scope
  firmware:
    schedule:
      interval: monthly
    commit-message:
      prefix: build
      include: scope

updates:
  - package-ecosystem: github-actions
    directories:
      - /
      - /.github/actions/*
    schedule:
      interval: weekly
    groups:
      github-actions:
        applies-to: version-updates
        patterns:
          - "*"

  - package-ecosystem: cargo
    directory: /firmware/streamline
    patterns:
      - "*"
    allow:
      - dependency-type: all
    multi-ecosystem-group: firmware

  - package-ecosystem: docker
    directory: /firmware/streamline
    patterns:
      - "*"
    multi-ecosystem-group: firmware

  - package-ecosystem: uv
    directory: /bridge
    patterns:
      - "*"
    allow:
      - dependency-type: all
    multi-ecosystem-group: host

  - package-ecosystem: uv
    directory: /tools
    patterns:
      - "*"
    allow:
      - dependency-type: all
    multi-ecosystem-group: host

  - package-ecosystem: npm
    directory: /console
    patterns:
      - "*"
    multi-ecosystem-group: host

  # The root Makefile's repository-check tool images.
  - package-ecosystem: docker
    directory: /.github
    patterns:
      - "*"
    multi-ecosystem-group: host

  - package-ecosystem: docker
    directory: /bridge
    patterns:
      - "*"
    multi-ecosystem-group: host

  - package-ecosystem: docker
    directory: /console
    patterns:
      - "*"
    multi-ecosystem-group: host

  - package-ecosystem: docker
    directory: /tools
    patterns:
      - "*"
    multi-ecosystem-group: host

  - package-ecosystem: docker
    directory: /ha-addon
    patterns:
      - "*"
    multi-ecosystem-group: host

  - package-ecosystem: docker
    directory: /webflasher
    patterns:
      - "*"
    multi-ecosystem-group: host
