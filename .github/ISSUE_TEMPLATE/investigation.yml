name: Investigation
description: Define a spike that must unblock a decision.
title: "<surface>: investigate <question>"
labels: ["question"]
body:
  - type: markdown
    attributes:
      value: |
        Do not include Wi-Fi names, passwords, admin keys, bearer tokens, real device IPs, or real hostnames. Use documentation addresses such as `192.0.2.x` and `streamline-0000.local`.
  - type: dropdown
    id: surface
    attributes:
      label: Surface
      description: Which part is affected?
      options:
        - Firmware
        - Console
        - Bridge
        - Home Assistant add-on
        - WebFlasher
        - Tools
        - Docs
        - CI or release
    validations:
      required: true
  - type: textarea
    id: question
    attributes:
      label: Question
      description: State the decision this investigation must unblock.
      placeholder: "Should StreamLine ...?"
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Context
      description: Give the facts already known.
    validations:
      required: true
  - type: textarea
    id: options
    attributes:
      label: Options to evaluate
      description: List credible options and the constraint each one must satisfy.
      placeholder: |
        - Option A: ...
        - Option B: ...
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Output
      description: Define what closes the issue.
      placeholder: "Decision, prototype, measurement, doc, or follow-up issues."
    validations:
      required: true
