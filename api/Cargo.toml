[package]
name = "streamline-api"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
license = "AGPL-3.0-or-later"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
utoipa = { version = "5.5.0", optional = true }
serde_json = { version = "1", optional = true }

[features]
openapi = ["dep:utoipa", "dep:serde_json"]

[dev-dependencies]
serde_json = "1"
serde_urlencoded = "0.7"
regex = "1"

[[bin]]
name = "streamline-openapi"
path = "src/bin/openapi.rs"
required-features = ["openapi"]
