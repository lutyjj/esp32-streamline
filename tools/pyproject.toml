[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "streamline-tools"
# Internal developer tooling: never released, not covered by version-check.
version = "0.1.0"
description = "ESP32 StreamLine developer tools"
requires-python = ">=3.12"
license = { text = "AGPL-3.0-or-later" }
dependencies = [
  "numpy>=2.2.6,<3",
]

[project.scripts]
streamline-analyze = "streamline_tools.analyze_capture:main"
streamline-capture = "streamline_tools.serial_capture:main"

[project.optional-dependencies]
dev = [
  "mypy==2.2.0",
  "ruff==0.15.21",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
files = ["src/streamline_tools"]
mypy_path = ["src"]
