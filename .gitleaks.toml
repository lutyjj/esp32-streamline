# Secret-scanner configuration for `make repository-secret-check`.
#
# The maintained default rule set stays in force; the entries below are narrow,
# reviewed exceptions scoped to a single path, not a relaxation of the scan.
# `repository-secret-scanner-self-test` proves the scanner still rejects a real
# provider credential.

[extend]
useDefault = true

[[allowlists]]
description = """
The firmware development signing key is committed deliberately. It signs
developer and QEMU images so they install over the air under the enforced
vendor-signature check and carry the key that verifies the next dev-signed
update. Its private half is public by design, so it provides integrity, not
authenticity, and it must never sign a product image. Release images are signed
with the maintainer key, which exists only in the FIRMWARE_SIGNING_KEY release
secret and never in the repository. See docs/ota.md#firmware-signing.
"""
paths = ['''firmware/streamline/dev_signing_key\.pem$''']
