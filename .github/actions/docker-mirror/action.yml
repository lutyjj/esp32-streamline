name: Docker Hub cache
description: Configure the hosted runner to pull Docker Hub images through Google's public cache.

runs:
  using: composite
  steps:
    - name: Configure Docker registry mirror
      shell: bash
      run: |
        config="$(mktemp)"
        trap 'rm -f "$config"' EXIT
        if sudo test -f /etc/docker/daemon.json; then
          sudo cat /etc/docker/daemon.json > "$config"
        else
          printf '{}\n' > "$config"
        fi
        jq '."registry-mirrors" = (["https://mirror.gcr.io"] + ((."registry-mirrors" // []) - ["https://mirror.gcr.io"]))' \
          "$config" > "$config.next"
        mv "$config.next" "$config"
        sudo dockerd --validate --config-file "$config"
        sudo install -D -m 644 "$config" /etc/docker/daemon.json
        sudo systemctl restart docker
        docker info --format '{{json .RegistryConfig.Mirrors}}'
