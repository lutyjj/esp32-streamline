[package]
name = "streamline-firmware"
version = "0.7.2" # x-release-please-version
edition = "2021"
rust-version = "1.82"
license = "AGPL-3.0-or-later"

[[bin]]
name = "streamline-firmware"
harness = false

[lib]
name = "streamline_firmware"

[profile.release]
opt-level = "s"

[profile.dev]
debug = true
opt-level = "z"

[dependencies]
# Host-testable core logic, so these must build for every target, not only the
# device: `sha2` backs the verifying-download pipeline in `update`; serde backs
# the board descriptor model in `board`, parsed and validated on the host.
sha2 = { version = "0.10", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_urlencoded = "0.7"
utoipa = { version = "5.5.0", optional = true }

[features]
api-spec = ["dep:utoipa"]
# Host-only generator for docs/pcm-frame-vectors.json. Gates the conformance
# corpus so it never compiles into the device image.
pcm-frame-vectors = []
# QEMU image variant: network over the emulated OpenCores Ethernet MAC
# instead of Wi-Fi, audio bring-up skipped. Built by `make -C firmware
# qemu-artifacts`; never part of a hardware release image.
qemu = []

[dev-dependencies]
# Host-only: proves the generated id pattern the console imports matches the
# device's own id validation. Never compiled into the device image.
regex = "1"

[target.'cfg(target_os = "espidf")'.dependencies]
anyhow = "1"
embedded-svc = "0.29"
esp-idf-svc = { version = "0.52.1", features = ["critical-section"] }
log = "0.4"

[build-dependencies]
embuild = { version = "0.33", features = ["espidf"] }

[[package.metadata.esp-idf-sys.extra_components]]
remote_component = { name = "espressif/mdns", version = "1.8.2" }

[[bin]]
name = "streamline-openapi"
path = "src/bin/openapi.rs"
required-features = ["api-spec"]

[[bin]]
name = "streamline-pcm-frame-vectors"
path = "src/bin/pcm_frame_vectors.rs"
required-features = ["pcm-frame-vectors"]
