[env:audio-level]
platform = espressif32
board = esp32dev
framework = arduino
board_upload.flash_size = 8MB
monitor_speed = 115200
upload_port = /dev/cu.usbserial-0001
monitor_port = /dev/cu.usbserial-0001
lib_deps =
  https://github.com/pschatzmann/arduino-audio-driver.git#v0.2.1
build_flags =
  -D AUDIO_INPUT_LINE=1
  -D AUDIO_INPUT_GAIN=25

