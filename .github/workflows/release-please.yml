name: Release Please

# Maintains the release PR. Merging it creates the tag and a draft release, then calls
# release.yml directly: events from GITHUB_TOKEN cannot trigger another workflow.
on:
  push:
    branches: [mainline]
  # Refreshes the release PR, e.g. after branch protection reports it behind mainline.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      # With the default token, CI on the release PR waits for "Approve and run";
      # a RELEASE_PLEASE_TOKEN fine-grained PAT starts it automatically.
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}

  publish:
    name: Publish
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
      pages: write
    uses: ./.github/workflows/release.yml
    secrets: inherit
    with:
      tag: ${{ needs.release-please.outputs.tag_name }}
