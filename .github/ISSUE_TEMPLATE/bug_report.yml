name: Bug report
description: Report behavior that breaks the current contract.
title: "<surface>: <specific failure>"
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Do not include Wi-Fi names, passwords, admin keys, bearer tokens, real device IPs, or real hostnames. Use documentation addresses such as `192.0.2.x` and `streamline-0000.local`.
  - type: dropdown
    id: surface
    attributes:
      label: Surface
      description: Which part is failing?
      options:
        - Firmware
        - Console
        - Bridge
        - Home Assistant add-on
        - WebFlasher
        - Tools
        - Docs
        - CI or release
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: State the failing behavior and the expected contract.
      placeholder: "The device reports ..., but it should ..."
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Include the shortest useful logs, commands, screenshots, versions, endpoint responses, or reproduction notes.
      placeholder: |
        1. Flash ...
        2. Configure ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: candidate-fix
    attributes:
      label: Candidate fix
      description: Describe the likely direction if known. Keep uncertainty visible.
  - type: textarea
    id: validation
    attributes:
      label: Validation
      description: What checks or live-device observations would prove the fix?
      placeholder: |
        - `make ...`
        - Device shows ...
    validations:
      required: true
