# Updates grouped by the proof each needs; docs/architecture.md#components owns
# the grouping and its tradeoffs. Version updates for uv and Cargo also refresh
# transitive dependencies, so routine updates carry most advisory fixes. Pins
# stay immutable: actions by commit SHA and images by digest.
version: 2

multi-ecosystem-groups:
  host:
    schedule:
      interval: weekly
    commit-message:
      prefix: build
      include: scope
  firmware:
    schedule:
      interval: monthly
    commit-message:
      prefix: build
      include: scope

updates:
  - package-ecosystem: github-actions
    directories:
      - /
      - /.github/actions/*
    schedule:
      interval: weekly
    groups:
      github-actions:
        applies-to: version-updates
        patterns:
          - "*"

  - package-ecosystem: cargo
    directory: /firmware/streamline
    patterns:
      - "*"
    allow:
      - dependency-type: all
    multi-ecosystem-group: firmware

  - package-ecosystem: docker
    directory: /firmware/streamline
    patterns:
      - "*"
    multi-ecosystem-group: firmware

  - package-ecosystem: uv
    directory: /bridge
    patterns:
      - "*"
    allow:
      - dependency-type: all
    multi-ecosystem-group: host

  - package-ecosystem: uv
    directory: /tools
    patterns:
      - "*"
    allow:
      - dependency-type: all
    multi-ecosystem-group: host

  - package-ecosystem: npm
    directory: /console
    patterns:
      - "*"
    multi-ecosystem-group: host

  # The root Makefile's repository-check tool images.
  - package-ecosystem: docker
    directory: /.github
    patterns:
      - "*"
    multi-ecosystem-group: host

  - package-ecosystem: docker
    directory: /bridge
    patterns:
      - "*"
    multi-ecosystem-group: host

  - package-ecosystem: docker
    directory: /console
    patterns:
      - "*"
    multi-ecosystem-group: host

  - package-ecosystem: docker
    directory: /tools
    patterns:
      - "*"
    multi-ecosystem-group: host

  - package-ecosystem: docker
    directory: /ha-addon
    patterns:
      - "*"
    multi-ecosystem-group: host

  - package-ecosystem: docker
    directory: /webflasher
    patterns:
      - "*"
    multi-ecosystem-group: host
