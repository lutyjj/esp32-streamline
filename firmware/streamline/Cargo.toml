[package]
name = "streamline-firmware"
version = "0.4.2"
edition = "2021"
rust-version = "1.82"
license = "AGPL-3.0-or-later"

[[bin]]
name = "streamline-firmware"
harness = false

[lib]
name = "streamline_firmware"

[profile.release]
opt-level = "s"

[profile.dev]
debug = true
opt-level = "z"

[dependencies]
# Host-testable core logic, so these must build for every target, not only the
# device: `sha2` backs the verifying-download pipeline in `update`; serde backs
# the board descriptor model in `board`, parsed and validated on the host.
sha2 = { version = "0.10", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_os = "espidf")'.dependencies]
anyhow = "1"
embedded-svc = "0.29"
esp-idf-svc = { version = "0.52.1", features = ["critical-section"] }
log = "0.4"

[build-dependencies]
embuild = { version = "0.33", features = ["espidf"] }

[[package.metadata.esp-idf-sys.extra_components]]
remote_component = { name = "espressif/mdns", version = "1.8.2" }
