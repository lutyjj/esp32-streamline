name: CI

on:
  push:
    branches: [mainline]
  pull_request:
    branches: [mainline]
  workflow_dispatch:
    inputs:
      run_qemu:
        description: Run the advisory QEMU device smoke suite regardless of changed paths
        type: boolean
        default: false
      sign_firmware:
        description: Sign this revision for testing on release-key devices (no release publication)
        type: boolean
        default: false
      test_source:
        description: Replace captured PCM with a test tone in the signed hardware image
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # `.github/ci-paths.yml` maps paths to components, and each matched component's
  # `make <name>-check` joins the matrix. Firmware keeps its own job for toolchain caching.
  changes:
    name: Detect changed areas
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      components: ${{ steps.matrix.outputs.components }}
      firmware: ${{ steps.filter.outputs.firmware }}
      api_contract: ${{ steps.filter.outputs.api_contract }}
      qemu_smoke: ${{ steps.filter.outputs.qemu_smoke }}
      console_e2e: ${{ steps.filter.outputs.console_e2e }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        id: filter
        with:
          filters: .github/ci-paths.yml
      - id: matrix
        # Every matched component except firmware and the internal pseudo-filters.
        run: |
          components=$(echo '${{ steps.filter.outputs.changes }}' \
            | jq -c '[.[] | select(. != "firmware" and . != "shared" and . != "api_contract" and . != "qemu_smoke" and . != "console_e2e")]')
          echo "components=$components" >> "$GITHUB_OUTPUT"

  checks:
    name: ${{ matrix.component }}
    needs: changes
    if: ${{ needs.changes.outputs.components != '[]' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        component: ${{ fromJSON(needs.changes.outputs.components) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/docker-mirror
      - run: make ${{ matrix.component }}-check

  # `checks` builds the add-on for amd64 only; this builds and tests it natively on
  # aarch64, the other architecture config.yaml publishes.
  ha-addon-aarch64:
    name: ha-addon (aarch64)
    needs: changes
    if: ${{ contains(fromJSON(needs.changes.outputs.components), 'ha-addon') }}
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/docker-mirror
      - run: make ha-addon-test

  firmware:
    name: Firmware (clippy · test · release build)
    needs: changes
    if: ${{ needs.changes.outputs.firmware == 'true' || needs.changes.outputs.qemu_smoke == 'true' || inputs.run_qemu || inputs.sign_firmware }}
    runs-on: ubuntu-latest
    env:
      CONTAINER_USER: 0:0
      CONTAINER_CARGO_HOME: /cargo-cache
      FIRMWARE_CARGO_CACHE_PATH: firmware/streamline/.cargo-home
      FIRMWARE_EMBUILD_CACHE_PATH: firmware/streamline/.embuild
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/docker-mirror

      - name: Restore firmware caches
        id: firmware-cache
        uses: ./.github/actions/firmware-cache
        with:
          operation: restore
          container-user: ${{ env.CONTAINER_USER }}
          cargo-cache-path: ${{ env.FIRMWARE_CARGO_CACHE_PATH }}
          embuild-cache-path: ${{ env.FIRMWARE_EMBUILD_CACHE_PATH }}

      - name: Check
        if: ${{ needs.changes.outputs.firmware == 'true' || inputs.sign_firmware }}
        run: |
          make firmware-check \
            CONTAINER_EXTRA_FLAGS="-v $PWD/$FIRMWARE_CARGO_CACHE_PATH:$CONTAINER_CARGO_HOME"

      - name: Build hardware image for manual signing
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.sign_firmware }}
        run: |
          make firmware-build FEATURES="${{ inputs.test_source && 'test-source' || '' }}" \
            CONTAINER_EXTRA_FLAGS="-v $PWD/$FIRMWARE_CARGO_CACHE_PATH:$CONTAINER_CARGO_HOME"

      - name: Sign the requested test image
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.sign_firmware }}
        env:
          FIRMWARE_SIGNING_KEY: ${{ secrets.FIRMWARE_SIGNING_KEY }}
        run: |
          umask 077
          key=firmware/streamline/.release_signing_key.pem
          trap 'shred -u "$key" 2>/dev/null || rm -f "$key"' EXIT
          test -n "$FIRMWARE_SIGNING_KEY"
          printf '%s\n' "$FIRMWARE_SIGNING_KEY" > "$key"
          unset FIRMWARE_SIGNING_KEY
          make -C firmware package VERSION=dev SIGNING_KEY=.release_signing_key.pem \
            CONTAINER_EXTRA_FLAGS="-v $PWD/$FIRMWARE_CARGO_CACHE_PATH:$CONTAINER_CARGO_HOME"

      - name: Upload signed test image
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.sign_firmware }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: signed-firmware-${{ github.sha }}
          overwrite: true
          path: |
            dist/firmware/streamline-dev-ota.bin
            dist/firmware/streamline-dev-full.bin
            dist/firmware/streamline-dev.elf
            dist/firmware/SHA256SUMS
          retention-days: 3
          if-no-files-found: error

      # Built here because this job owns the warm toolchain caches.
      - name: Build QEMU variant images
        run: |
          make firmware-qemu-artifacts \
            CONTAINER_EXTRA_FLAGS="-v $PWD/$FIRMWARE_CARGO_CACHE_PATH:$CONTAINER_CARGO_HOME"

      # `overwrite` lets both full and failed-jobs-only reruns find the images.
      - name: Upload QEMU variant images
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: qemu-firmware-images-${{ github.sha }}
          overwrite: true
          path: |
            dist/firmware/streamline-qemu-full.bin
            dist/firmware/streamline-qemu-ota.bin
            dist/firmware/streamline-qemu-fail-management-ota.bin
            dist/firmware/streamline-qemu.elf
            dist/firmware/streamline-qemu-fail-management.elf
          retention-days: 3
          if-no-files-found: error

      - name: Reclaim firmware caches
        if: always()
        uses: ./.github/actions/firmware-cache
        with:
          operation: reclaim
          cargo-cache-path: ${{ env.FIRMWARE_CARGO_CACHE_PATH }}
          embuild-cache-path: ${{ env.FIRMWARE_EMBUILD_CACHE_PATH }}

      - name: Save firmware caches
        if: ${{ success() }}
        uses: ./.github/actions/firmware-cache
        with:
          operation: save
          cargo-cache-path: ${{ env.FIRMWARE_CARGO_CACHE_PATH }}
          embuild-cache-path: ${{ env.FIRMWARE_EMBUILD_CACHE_PATH }}
          embuild-cache-hit: ${{ steps.firmware-cache.outputs.embuild-cache-hit }}
          cargo-cache-hit: ${{ steps.firmware-cache.outputs.cargo-cache-hit }}

  # Advisory: failures stay visible but outside the required CI complete check.
  qemu-smoke:
    name: QEMU device smoke (advisory)
    needs: [changes, firmware]
    if: ${{ needs.changes.outputs.qemu_smoke == 'true' || inputs.run_qemu }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/docker-mirror
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: qemu-firmware-images-${{ github.sha }}
          path: dist/firmware
      # Two workers on four vCPUs leave half the CPUs for QEMU; more workers
      # reproduce the "no healthy response" setup flake.
      - run: make tools-smoke-qemu SMOKE_JOBS=2
      - name: Preserve failed QEMU state
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: qemu-failure-${{ github.sha }}-${{ github.run_attempt }}
          path: tools/.smoke-qemu/
          include-hidden-files: true
          retention-days: 3
          if-no-files-found: warn

  api-contract:
    name: Device API contract
    needs: changes
    if: ${{ needs.changes.outputs.api_contract == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/docker-mirror
      - run: make api-contract-check

  console-e2e:
    name: Console e2e journeys
    needs: changes
    if: ${{ needs.changes.outputs.console_e2e == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/docker-mirror
      - run: make console-e2e

  # The one required check. Skipped components count as passed, so path filters
  # never leave a pull request waiting on a check that will not report.
  ci-complete:
    name: CI complete
    if: ${{ always() }}
    needs: [changes, checks, ha-addon-aarch64, firmware, api-contract, console-e2e]
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Verify no required job failed
        run: |
          echo "changes=${{ needs.changes.result }} checks=${{ needs.checks.result }} ha_addon_aarch64=${{ needs.ha-addon-aarch64.result }} firmware=${{ needs.firmware.result }} api_contract=${{ needs.api-contract.result }} console_e2e=${{ needs.console-e2e.result }}"
          if [ "${{ needs.changes.result }}" != "success" ]; then
            echo "::error::change detection failed"; exit 1
          fi
          for r in "${{ needs.checks.result }}" "${{ needs.ha-addon-aarch64.result }}" "${{ needs.firmware.result }}" "${{ needs.api-contract.result }}" "${{ needs.console-e2e.result }}"; do
            case "$r" in
              success|skipped) ;;
              *) echo "::error::a required job did not pass ($r)"; exit 1 ;;
            esac
          done
          echo "All required checks passed."
