# CI ownership is data: dorny/paths-filter consumes this file directly and the
# tools path-matrix test pins representative inputs to every owning check.
shared: &shared
  - '.github/workflows/ci.yml'
  - '.github/ci-paths.yml'
  - '.github/actions/**'
  - 'Makefile'
  - 'mk/**'

repository:
  - *shared
  - '.github/**'
  - '.markdownlint.json'
  - '.release-please-manifest.json'
  - 'lychee.toml'
  - 'release-please-config.json'
  - 'repository.yaml'
  - '*.md'
  - '**/*.md'
  - 'docs/**'
  # The dependency audit owns every committed lockfile and its allowlist.
  - 'osv-scanner.toml'
  - 'bridge/uv.lock'
  - 'console/package-lock.json'
  - 'firmware/streamline/Cargo.lock'
  - 'api/Cargo.lock'
  - 'tools/uv.lock'

bridge:
  - *shared
  - 'bridge/**'
  - 'console/**'
  - 'docs/bridge-openapi.json'
  - 'docs/pcm-protocol.md'
  - 'docs/pcm-transport.json'
  - 'docs/pcm-frame-vectors.json'
  # The bridge option-contract test pins the add-on's config.
  - 'ha-addon/config.yaml'

console:
  - *shared
  - 'console/**'
  - 'bridge/**'
  - 'docs/bridge-openapi.json'
  # The curl-example disposition test pins every device-contract operation.
  - 'api/openapi.json'

# The e2e journeys drive the device console against its contract-derived
# mock and the bridge console against the real bridge, so the console, the
# device contract, and the bridge all retrigger them.
console_e2e:
  - *shared
  - 'console/**'
  - 'bridge/**'
  - 'api/openapi.json'
  - 'docs/bridge-openapi.json'

tools:
  - *shared
  - 'tools/**'

webflasher:
  - *shared
  - 'webflasher/**'

ha-addon:
  - *shared
  - 'ha-addon/**'
  - 'tools/src/streamline_tools/addon_confinement.py'
  - 'docs/pcm-frame-vectors.json'
  - 'console/**'
  - 'repository.yaml'
  - 'bridge/pyproject.toml'
  - 'bridge/uv.lock'
  - 'bridge/src/**'
  - 'bridge/tests/**'

api:
  - *shared
  - 'api/**'

firmware:
  - *shared
  - 'firmware/**'
  - 'api/**'
  - 'docs/pcm-protocol.md'
  - 'docs/pcm-transport.json'
  - 'docs/pcm-frame-vectors.json'

api_contract:
  - *shared
  - 'api/**'

qemu_smoke:
  - *shared
  - 'firmware/**'
  - 'api/**'
  - 'tools/Dockerfile'
  - 'tools/Makefile'
  - 'tools/pyproject.toml'
  - 'tools/uv.lock'
  - 'tools/smoke/**'
  - 'tools/src/streamline_tools/device/**'
  - 'tools/src/streamline_tools/smoke.py'
