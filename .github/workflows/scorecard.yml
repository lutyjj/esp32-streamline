name: Scorecard

# OpenSSF Scorecard analyzes the repository's supply-chain posture — pinned
# dependencies, token permissions, branch protection, dangerous workflow
# patterns — and uploads findings to the Security tab. Published results feed
# the public Scorecard REST API and badge.
on:
  schedule:
    - cron: "23 6 * * 1"
  push:
    branches: [mainline]
  # Branch-protection changes affect the score as soon as they happen.
  branch_protection_rule:
  workflow_dispatch:

# Scorecard reads many repository facets; grant read-only across the board
# and write scopes only where the job needs them.
permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      # Upload SARIF to code scanning.
      security-events: write
      # Sign published results (OIDC).
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Run analysis
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Upload to code scanning
        uses: github/codeql-action/upload-sarif@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4
        with:
          sarif_file: results.sarif
