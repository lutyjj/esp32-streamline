name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Verify and publish release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Derive and validate release version
        id: version
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          test "$version" = "$(sed -n 's/^version = "\([^"]*\)"/\1/p' bridge/pyproject.toml)"
          test "$version" = "$(sed -n 's/^version = "\([^"]*\)"/\1/p' firmware/streamline/Cargo.toml)"
          printf 'value=%s\n' "$version" >> "$GITHUB_OUTPUT"

      - name: Build release deliverables
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/esp32-streamline-bridge
        run: make release VERSION=${{ steps.version.outputs.value }} BRIDGE_IMAGE="$IMAGE"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish bridge image
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/esp32-streamline-bridge
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          docker tag "$IMAGE:$VERSION" "$IMAGE:latest"
          docker push "$IMAGE:$VERSION"
          docker push "$IMAGE:latest"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/firmware/* --generate-notes
