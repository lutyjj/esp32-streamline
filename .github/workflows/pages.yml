name: Deploy WebFlasher

on:
  push:
    branches: ["mainline"]
    paths:
      - "webflasher/**"
      - "console/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:
  # release.yml calls this after publishing: releases created with GITHUB_TOKEN fire
  # no `release` event for other workflows.
  workflow_call:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Publish WebFlasher to GitHub Pages
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/docker-mirror

      - name: Build the WebFlasher
        run: make console-build

      - name: Bundle latest stable firmware into the site
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Release assets send no CORS headers to a Pages origin, so the site serves the
          # latest stable full image same-origin, from the Pages artifact only.
          tag="$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" --jq .tag_name)"
          gh release download "$tag" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern 'streamline-[0-9]*-full.bin' \
            --dir webflasher --clobber
          mv webflasher/streamline-[0-9]*-full.bin webflasher/streamline-full.bin
          # Surface the real version in the install dialog instead of "latest".
          jq --arg v "${tag#v}" '.version = $v' webflasher/manifest.json > webflasher/manifest.json.tmp
          mv webflasher/manifest.json.tmp webflasher/manifest.json
          cp console/dist/flasher/flasher.html webflasher/index.html

      # The manifest must describe the exact binary beside it and carry the
      # release it was patched with.
      - name: Verify the assembled site
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" --jq .tag_name)"
          manifest=webflasher/manifest.json
          test "$(jq -r '.version' "$manifest")" = "${tag#v}"
          test "$(jq '.builds | length' "$manifest")" = 1
          test "$(jq -r '.builds[0].chipFamily' "$manifest")" = ESP32
          test "$(jq '.builds[0].parts | length' "$manifest")" -ge 1
          jq -r '.builds[0].parts[] | "\(.path) \(.offset)"' "$manifest" | while read -r path offset; do
            test "$offset" = 0
            # A tiny file means the wrong asset was bundled.
            test "$(stat -c %s "webflasher/$path")" -gt 1000000
          done
          test -s webflasher/index.html

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          name: github-pages-${{ github.run_attempt }}
          path: webflasher
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
