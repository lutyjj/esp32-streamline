name: Scorecard

# OpenSSF Scorecard analyzes the repository's supply-chain posture — pinned
# dependencies, token permissions, branch protection, dangerous workflow
# patterns — and uploads findings to the Security tab. Published results feed
# the public Scorecard REST API and badge.
on:
  schedule:
    - cron: "23 6 * * 1"
  push:
    branches: [mainline]
  # Branch-protection changes affect the score as soon as they happen.
  branch_protection_rule:
  workflow_dispatch:

# Scorecard reads many repository facets; grant read-only across the board
# and write scopes only where the job needs them.
permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      # Upload SARIF to code scanning.
      security-events: write
      # Sign published results (OIDC).
      id-token: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false

      - name: Run analysis
        uses: ossf/scorecard-action@4eaacf0543bb3f2c246792bd56e8cdeffafb205a # v2.4.3
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Upload to code scanning
        uses: github/codeql-action/upload-sarif@7188fc363630916deb702c7fdcf4e481b751f97a # v4
        with:
          sarif_file: results.sarif
